[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "anyio: marks anyio async tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "venv",
    ".venv",
    "scratch",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E402",
    "F401",
]

[tool.ruff.lint.per-file-ignores]
# ML training scripts — allow ambiguous loop vars (l for label/loss) and unused intermediates
"ml/scripts/*.py" = ["E741", "F841", "W293"]
# RAG grounding/research — allow unused intermediates in complex NLI pipelines
"rag/grounding/*.py" = ["F841"]
"rag/policy/*.py" = ["F841"]
# RLHF training — allow unused loop counters in evaluation harness
"rlhf/training/*.py" = ["F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
disallow_untyped_defs = false