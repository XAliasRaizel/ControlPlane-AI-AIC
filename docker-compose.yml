services:
  controlplane-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: controlplane-ai:latest
    env_file:
      - .env
    environment:
      CONTROLPLANE_DB_PATH: /data/controlplane.db
      CONTROLPLANE_POLICIES_DIR: /app/policies
      CONTROLPLANE_JSON_LOGS: "true"
    ports:
      - "8000:8000"
    volumes:
      - controlplane_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  controlplane-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: controlplane-ai:latest
    env_file:
      - .env
    command: >
      python -m streamlit run frontend/streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
    ports:
      - "8501:8501"
    environment:
      CONTROLPLANE_API_URL: http://controlplane-api:8000
    depends_on:
      controlplane-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped

volumes:
  controlplane_data:
    driver: local