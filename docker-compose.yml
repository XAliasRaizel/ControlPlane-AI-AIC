services:
  controlplane-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      CONTROLPLANE_DB_PATH: /data/controlplane.db
      CONTROLPLANE_POLICIES_DIR: /app/policies
      CONTROLPLANE_AUDIT_HASH_KEY: ${CONTROLPLANE_AUDIT_HASH_KEY:-local-prototype-not-a-secret}
    volumes:
      - controlplane_data:/data

  controlplane-ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      - controlplane-api

volumes:
  controlplane_data:
