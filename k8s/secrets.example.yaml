# ============================================================
# ControlPlane.ai — Kubernetes Secret template
#
# DO NOT commit real secrets. This is a placeholder template.
#
# To create the actual secret, run:
#   kubectl create namespace controlplane
#   kubectl create secret generic controlplane-secrets \
#     --namespace controlplane \
#     --from-env-file=.env
#
# Or apply this file after base64-encoding your values:
#   echo -n "YOUR_VALUE" | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: controlplane-secrets
  namespace: controlplane
  labels:
    app: controlplane-api
type: Opaque
stringData:
  # --- Core ---
  CONTROLPLANE_AUDIT_HASH_KEY: "REPLACE_WITH_STRONG_RANDOM_SECRET"
  CONTROLPLANE_API_KEYS: "REPLACE_WITH_COMMA_SEPARATED_API_KEYS"
  CONTROLPLANE_ADMIN_KEYS: "REPLACE_WITH_ADMIN_KEY"
  CONTROLPLANE_LOG_LEVEL: "INFO"
  CONTROLPLANE_MAX_PROMPT_CHARS: "12000"

  # --- Rate Limiting ---
  CONTROLPLANE_RATE_LIMIT_GOVERN: "60"
  CONTROLPLANE_RATE_LIMIT_DEFAULT: "120"

  # --- LLM Providers ---
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  GROQ_MODEL: "openai/gpt-oss-120b"
  CP_JUDGE_PROVIDER: "groq"
  CP_JUDGE_MODEL: "llama3-8b-8192"

  # --- Observability ---
  CONTROLPLANE_OTLP_ENDPOINT: ""
  CONTROLPLANE_OTEL_SERVICE_NAME: "controlplane-api"