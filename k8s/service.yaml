# ============================================================
# ControlPlane.ai — Kubernetes ClusterIP Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: controlplane-api
  namespace: controlplane
  labels:
    app: controlplane-api
spec:
  type: ClusterIP
  selector:
    app: controlplane-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000