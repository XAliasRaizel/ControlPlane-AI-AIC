# ============================================================
# ControlPlane.ai — GitHub Actions CI Pipeline
# Triggers: push + PR to main
# Jobs: lint | test | security | docker
# ============================================================

name: ControlPlane.ai CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ----------------------------------------------------------
  # JOB 1: Lint (ruff + mypy)
  # ----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: ruff check
        run: python -m ruff check backend/ tests/ --output-format=github

      - name: mypy type check
        run: python -m mypy backend/ --ignore-missing-imports --no-error-summary
        continue-on-error: true   # advisory; does not fail the pipeline

  # ----------------------------------------------------------
  # JOB 2: Unit + integration tests (no slow/perf tests)
  # ----------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (skip slow/perf)
        run: |
          python -m pytest tests/ -q --tb=short -m "not slow" \
            --junit-xml=test-results.xml
        env:
          RAG_EMBEDDING_BACKEND: sentence_transformers
          RAG_RERANK_ENABLED: "true"
          RAG_NLI_ENABLED: "true"
          RAG_BM25_ENABLED: "true"
          RAG_MULTI_TENANT_ENABLED: "false"
          CONTROLPLANE_API_KEYS: "ci-test-key"
          CONTROLPLANE_AUDIT_HASH_KEY: "ci-test-hash-key"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ----------------------------------------------------------
  # JOB 3: Security — pip-audit CVE scan
  # ----------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-audit-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit CVE scan
        run: pip-audit -r requirements.txt --output=json --output-file=audit-report.json
        continue-on-error: true   # report but do not block merge

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: audit-report.json

  # ----------------------------------------------------------
  # JOB 4: Docker smoke build (no push on PRs)
  # ----------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for build context
        run: cp .env.example .env

      - name: Docker build smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: controlplane-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max