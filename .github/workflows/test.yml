name: ControlPlane.ai CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest tests/ -q --tb=short
        env:
          RAG_EMBEDDING_BACKEND: sentence_transformers
          RAG_RERANK_ENABLED: "true"
          RAG_NLI_ENABLED: "true"
          RAG_BM25_ENABLED: "true"
          RAG_MULTI_TENANT_ENABLED: "true"

  rag-triad-eval:
    name: RAG Triad Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest corpus (default tenant)
        run: python -m rag.ingestion.ingest
        env:
          RAG_EMBEDDING_BACKEND: sentence_transformers
          RAG_RERANK_ENABLED: "false"

      - name: Run RAG Triad evaluation
        run: |
          python scripts/eval_rag_triad.py \
            --report \
            --output rag_triad_results.json \
            --fail-under-context-relevance 0.65 \
            --fail-under-groundedness 0.65 \
            --fail-under-answer-relevance 0.70
        env:
          RAG_EMBEDDING_BACKEND: sentence_transformers
          RAG_RERANK_ENABLED: "true"
          RAG_NLI_ENABLED: "true"
          RAG_BM25_ENABLED: "true"
          RAG_MULTI_TENANT_ENABLED: "true"
          RAG_LLM_PROVIDER: ollama

      - name: Upload RAG Triad results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-triad-results
          path: rag_triad_results.json
